<script>
let W=960;const cv=document.getElementById('c'),g=cv.getContext('2d'),H=540;

let stars=[];
function mkStars(){stars=Array.from({length:70},()=>[rnd(0,W),rnd(0,H*.8),rnd(.5,1.8)])}
function fit(){const a=innerWidth/innerHeight,nw=Math.round(H*Math.min(Math.max(a,16/9),2.4));

 const sc=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*sc+'px';cv.style.height=H*sc+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
let mode=1,diff=1,sel=0,listen=-1,back='menu',state='menu',plats=[],P,B,parts=[],ev=null,nextT=0,pend=null,wind=0,frame=0,msg='',msgT=0,lastEv='',winner='',shake=0;
let matchCfg={lives:3,wins:5},roundWins=[0,0],matchPlayers=[],spectators=new Set(),spectating=false;
function kd(c){if(!keys[c])prs[c]=1;keys[c]=1}

function setGp(i,b){const act=AK[Math.floor(i/3)];for(const a of AK)if(a!==act&&gpb[a]===b)gpb[a]=gpb[act];gpb[act]=b;save()}
function setBind(i,code){const pl=i%3===1?'p2':'p1',act=AK[Math.floor(i/3)];for(const q of['p1','p2'])for(const a of AK)if(binds[q][a]===code&&!(q===pl&&a===act))binds[q][a]=binds[pl][act];binds[pl][act]=code;save()}

function openKeys(b){back=b;state='keys';sel=0}

function items(){const D=['Fácil','Normal','Difícil'],dl=['Dificuldade do bot: '+D[diff],cyc];

 if(state==='join')return[['Código: '+(joinCode.padEnd(5,'_').split('').join(' ')),askCode],['Entrar',tryJoin],['Voltar',()=>{state='online';sel=0}]];
 if(state==='menu')return[['ONLINE',()=>{state='online';sel=0}],['1 JOGADOR  (contra o bot)',()=>{mode=1;start()}],['2 JOGADORES  (local)',()=>{mode=2;start()}],dl,['Configurar teclas',()=>openKeys('menu')]];
 if(state==='pause')return[['Continuar',()=>{state='play'}],dl,['Configurar teclas',()=>openKeys('pause')],['Reiniciar partida',start],['Menu principal',toMenu]];

function nav(c){
 if(state==='lobby'||state==='matchcfg'){lobbyNav(c);return}
 if(state==='keys'){const n=sel;
  if(c==='ArrowUp')sel=n>=20?n:n>=3&&n<18?n-3:n<3?20+Math.min(n,1):n===18?15:16;
  else if(c==='ArrowDown')sel=n>=20?n-20:n<15?n+3:n<18?(n===15?18:19):n;
  else if(c==='ArrowLeft'||c==='ArrowRight'){const d=c==='ArrowLeft'?-1:1;sel=n>=20?n^1:n<18?Math.floor(n/3)*3+(n%3+d+3)%3:(n===18?19:18)}
  else if(c==='Enter'||c==='Space'){if(n>=20)cycDev(n-20);else if(n<18)listen=n;else if(n===18)resetKeys();else state=back}
  return}
 const L=items().length;
 if(c==='ArrowUp')sel=(sel+L-1)%L;else if(c==='ArrowDown')sel=(sel+1)%L;
 else if(c==='Enter'||c==='Space')items()[sel][1]();
 else if(state==='menu'&&(c==='Digit1'||c==='Digit2')){mode=c==='Digit1'?1:2;start()}
 else if(state==='over'&&c==='KeyR')start()}
addEventListener('keydown',e=>{const c=e.code;if(c.startsWith('Arrow')||c==='Space')e.preventDefault();
 if(state==='keys'&&listen>=0){if(listen%3===2){if(c==='Escape')listen=-1;return}if(c!=='Escape')setBind(listen,c);listen=-1;return}
 if(state==='join'){if(/^(Key[A-Z]|Digit\d)$/.test(c)&&joinCode.length<5){joinCode+=c.slice(-1);joinErr='';return}if(c==='Backspace'){joinCode=joinCode.slice(0,-1);return}}
 if(c==='Escape'){if(state==='online')toMenu();else if(state==='join'){state='online';sel=0}else if(state==='matchcfg')closeMatchCfg();else if(state==='lobby')leaveRoom();else if(state==='play')pause();else if(state==='pause')state='play';else if(state==='keys'){state=back;sel=0}return}

cv.addEventListener('pointerdown',e=>{if(state==='play'){if(e.pointerType==='mouse'){e.preventDefault();kd('Mouse'+e.button)}return}
 if(state==='keys'&&listen>=0&&listen%3!==2&&e.pointerType==='mouse'){setBind(listen,'Mouse'+e.button);listen=-1;return}const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width-(W-960)/2,y=(e.clientY-r.top)*H/r.height;
 if(state==='lobby'){lobbyClick(x,y);return}
 if(state==='matchcfg'){cfgClick(x,y);return}
 if(state==='keys'){if(listen>=0&&listen%3===2)listen=-1;for(let i=0;i<18;i++){const rw=Math.floor(i/3),c=i%3;if(x>KX[c]&&x<KX[c]+165&&y>150+rw*46&&y<188+rw*46){sel=i;listen=i}}
  for(let c=0;c<2;c++)if(x>KX[c]&&x<KX[c]+165&&y>100&&y<138){sel=20+c;cycDev(c)}
  if(y>440&&y<480){if(x>300&&x<470)resetKeys();else if(x>490&&x<660){state=back;sel=0}}return}
 items().forEach((it,i)=>{if(Math.abs(x-480)<230&&y>190+i*56&&y<236+i*56){sel=i;it[1]()}})});

document.querySelectorAll('#tc button').forEach(b=>{let c=null;b.addEventListener('pointerdown',e=>{e.preventDefault();c=binds.p1[b.dataset.k];kd(c)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{if(c)ku(c);c=null}))});

function genMap(){plats=[];
 const mk=(cx,y,w)=>plats.push({cx,y,w,w0:w,tw:w,off:0,am:0,ta:0,ph:rnd(0,6.28),st:'on',t:0,l:cx-w/2,r:cx+w/2,dx:0});
 mk(W/2+rnd(-60,60),rnd(330,380),rnd(280,360));
 const n=Math.floor(rnd(3,6));let tries=0;
 while(plats.length<n+1&&tries++<300){const w=rnd(120,220),cx=rnd(110,W-110),y=rnd(170,440);
  if(plats.every(q=>Math.abs(q.cx-cx)>(q.w+w)/2+30||Math.abs(q.y-y)>70))mk(cx,y,w)}}
function mkP(col,bot){return{x:0,y:0,vx:0,vy:0,w:28,h:44,f:1,j:2,dash:0,dcd:0,atk:0,acd:0,hit:0,dmg:0,st:3,col,bot,stun:0,inv:0,gr:false,on:null,dead:0}}
function start(resetMatch=true){state='play';if(resetMatch){roundWins=[0,0];spectators=new Set();spectating=false}genMap();P=mkP('#4fc3f7',0);B=mkP('#ff7043',mode===1);
 P.st=matchCfg.lives;B.st=matchCfg.lives;
 const m=plats[0];P.x=m.cx-84;P.y=m.y-P.h;B.x=m.cx+56;B.y=m.y-B.h;B.f=-1;
 ev=null;pend=null;wind=0;nextT=480;frame=0;parts=[];bars=[];mets=[];msg='Derrube o oponente da plataforma!';msgT=150}
function burst(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-4,4),vy:rnd(-4,4),l:rnd(20,40),c})}

function evStart(n){ev={n,t:n===EVS[5]?600:420,m:n===EVS[5]?600:420,d:Math.random()<.5?-1:1};lastEv=n;msg='EVENTO: '+n+'!';msgT=150;
 if(n===EVS[1])plats.forEach(q=>q.tw=q.w0*.5);
 if(n===EVS[2])plats.slice().sort(()=>Math.random()-.5).slice(0,Math.floor(plats.length/2)).forEach(q=>{q.st='blink';q.t=90});
 if(n===EVS[3])plats.forEach(q=>q.ta=rnd(50,90)*(Math.random()<.5?-1:1));
 if(n===EVS[4])plats.slice().sort(()=>Math.random()-.5).slice(0,Math.max(1,Math.floor(plats.length/2))).forEach(q=>{q.sp={fr:rnd(.1,.9),t:0}})}
function evEnd(){if(ev.n===EVS[4])plats.forEach(q=>q.sp=null);if(ev.n===EVS[1])plats.forEach(q=>q.tw=q.w0);if(ev.n===EVS[3])plats.forEach(q=>q.ta=0);ev=null;wind=0;nextT=60;pend=EVS.filter(x=>x!==lastEv)[Math.floor(Math.random()*(EVS.length-1))];msg='Atenção: '+pend+' em 1s';msgT=60}
let bars=[],mets=[];
function spX(q){const sw=Math.min(90,q.w*.4);return[q.l+(q.w-sw)*q.sp.fr,sw]}
function hurt(p,dmg,vx,vy){if(p.dead>0||p.inv>0)return;p.dmg+=dmg;p.vx=vx;p.vy=vy;p.stun=Math.round(14+Math.min(p.dmg*.1,16));p.dash=0;p.gr=false;p.inv=45;burst(p.x+14,p.y+22,12,'#ff5252');shake=7}
function hazards(){
 plats.forEach(q=>{if(!q.sp||q.st==='off')return;if(++q.sp.t<60)return;const[sx,sw]=spX(q);
  [P,B].forEach(p=>{if(p.dead>0)return;const fb=p.y+p.h;if(p.x+p.w>sx&&p.x<sx+sw&&fb>q.y-14&&fb<=q.y+10&&p.y<q.y)hurt(p,7,(p.x+14<sx+sw/2?-1:1)*5,-9)})});
 bars=bars.filter(b=>{b.x+=b.d*4.2;[P,B].forEach(p=>{if(p.dead<=0&&p.x+p.w>b.x-b.w/2&&p.x<b.x+b.w/2&&p.y+p.h>b.y&&p.y<b.y+b.h)hurt(p,8,b.d*10,-4)});return b.x>-60&&b.x<W+60});
 mets=mets.filter(m=>{m.x+=m.vx;m.y+=m.vy;let hit=false;
  [P,B].forEach(p=>{if(p.dead>0)return;const cx=Math.max(p.x,Math.min(m.x,p.x+p.w)),cy=Math.max(p.y,Math.min(m.y,p.y+p.h));if((m.x-cx)**2+(m.y-cy)**2<m.r*m.r){hurt(p,12,(p.x+14<m.x?-1:1)*7,-8);hit=true}});
  if(!hit)for(const q of plats)if(q.st!=='off'&&m.y+m.r>=q.y&&m.y-m.vy+m.r<=q.y+8&&m.x>q.l&&m.x<q.r){hit=true;break}
  if(hit){burst(m.x,m.y,14,'#ffa726');shake=Math.max(shake,5)}
  return !hit&&m.y<H+60})}
function drawHaz(){
 plats.forEach(q=>{if(!q.sp||q.st==='off')return;const[sx,sw]=spX(q),act=q.sp.t>=60,n=Math.max(3,Math.round(sw/16)),tw=sw/n;
  g.globalAlpha=act?1:(Math.floor(frame/6)%2?.15:.45);g.fillStyle=act?'#e0e0e0':'#ff5252';
  for(let k=0;k<n;k++){g.beginPath();g.moveTo(sx+k*tw,q.y);g.lineTo(sx+k*tw+tw/2,q.y-(act?16:8));g.lineTo(sx+(k+1)*tw,q.y);g.fill()}g.globalAlpha=1});
 bars.forEach(b=>{g.globalAlpha=.85;g.fillStyle='#ff5252';rr(b.x-b.w/2,b.y,b.w,b.h,6);g.fill();g.globalAlpha=.35;g.fillStyle='#fff';g.fillRect(b.x-2,b.y+4,4,b.h-8);g.globalAlpha=1});
 mets.forEach(m=>{g.globalAlpha=.35;g.fillStyle='#ffa726';g.beginPath();g.moveTo(m.x-m.r*.8,m.y);g.lineTo(m.x-m.vx*7,m.y-m.vy*7);g.lineTo(m.x+m.r*.8,m.y);g.fill();g.globalAlpha=1;
  g.fillStyle='#8d6e63';g.beginPath();g.arc(m.x,m.y,m.r,0,7);g.fill();g.fillStyle='#ff7043';g.beginPath();g.arc(m.x-m.r*.25,m.y+m.r*.25,m.r*.5,0,7);g.fill()})}
function drawDark(){if(ev&&ev.n===EVS[8]){g.fillStyle='rgba(0,0,10,1)';g.fillRect(-20,-20,W+40,H+40)}}
function updPlat(){plats.forEach(q=>{const ol=q.l;q.w+=(q.tw-q.w)*.05;q.am+=(q.ta-q.am)*.03;q.off=q.am*Math.sin(frame*.025+q.ph);

function events(){if(ev){wind=ev.n===EVS[0]?ev.d*.28:0;

 if(ev.n===EVS[6]&&ev.t>40&&Math.random()<.04)mets.push({x:rnd(40,W-40),y:-30,vx:rnd(-2,2),vy:rnd(6,9),r:rnd(12,20)});
 if(--ev.t<=0)evEnd();return}
 nextT--;if(nextT===120){pend=EVS.filter(x=>x!==lastEv)[Math.floor(Math.random()*(EVS.length-1))];msg='Atenção: '+pend+' em 2s';msgT=120}
 if(nextT<=0&&pend){evStart(pend);pend=null}}

function die(p){burst(Math.max(20,Math.min(W-20,p.x)),Math.max(20,Math.min(H-20,p.y)),30,p.col);shake=12;p.st--;p.dead=70;p.dmg=0;p.x=-9999;p.vx=p.vy=0;
 if(p.st<=0){const loser=p===P?0:1, winnerIdx=loser?0:1;roundWins[winnerIdx]++;
  if(roundWins[winnerIdx]>=matchCfg.wins){state='over';sel=0;winner=mode===1?(winnerIdx?'O BOT VENCEU':'VOCÊ VENCEU!'):(winnerIdx?'JOGADOR 2 VENCEU!':'JOGADOR 1 VENCEU!');return}
  msg=(winnerIdx===0?'JOGADOR 1':'JOGADOR 2')+' ganhou a queda ('+roundWins[winnerIdx]+'/'+matchCfg.wins+')';msgT=150;
  start(false);return}

function respawn(p){const l=plats.filter(q=>q.st!=='off'),q=l[Math.floor(Math.random()*l.length)];

function step(p,o,i){const zg=ev&&ev.n===EVS[7];
 if(p.dead>0){if(--p.dead===0)respawn(p);return}
 if(p.dcd)p.dcd--;if(p.acd)p.acd--;if(p.stun>0)p.stun--;if(p.inv)p.inv--;
 const free=!(p.stun>0);
 if(free){const d=(i.r?1:0)-(i.l?1:0);
  if(d){p.f=d;if(p.dash<=0)p.vx+=d*(p.gr?1:.65)}else if(p.dash<=0)p.vx*=p.gr?.78:.97;
  if(i.jump&&(p.j>0||zg)&&p.dash<=0){p.vy=zg?-6:-11.5;if(p.j>0)p.j--;p.gr=false;burst(p.x+14,p.y+p.h,6,'#fff')}
  if(i.dash&&!p.dcd){p.dash=9;p.dcd=70;p.vx=p.f*16;p.vy=0}
  if(i.atk&&!p.acd){p.atk=12;p.acd=26;p.hit=0}}
 if(p.dash>0){p.dash--;p.vy=0;parts.push({x:p.x+14,y:p.y+22,vx:0,vy:0,l:12,c:p.col})}
 else{p.vy=zg?Math.min(15,p.vy*.985+(free&&i.down?.45:0)):Math.min(p.vy+.6,15);p.vx+=wind;if(free&&Math.abs(p.vx)>5.2)p.vx*=.9;else if(!free)p.vx*=.985}
 const pb=p.y+p.h,was=p.gr,drop=free&&i.down;p.x+=p.vx;p.y+=p.vy;p.gr=false;p.on=null;if(zg&&p.y<-20){p.y=-20;if(p.vy<0)p.vy=0}
 for(const q of plats){if(q.st!=='off'&&!drop&&p.vy>=0&&pb<=q.y+8&&p.y+p.h>=q.y&&p.x+p.w>q.l&&p.x<q.r){p.y=q.y-p.h;p.vy=0;p.gr=true;p.on=q;p.j=2;p.x+=q.dx;break}}
 if(was&&!p.gr&&p.j===2)p.j=1;
 if(p.atk>0){p.atk--;
  if(!p.hit&&o.dead<=0&&!o.inv){const ax=p.f>0?p.x+p.w:p.x-50;
   if(ax<o.x+o.w&&ax+50>o.x&&p.y-6<o.y+o.h&&p.y+p.h+6>o.y){p.hit=1;o.dmg+=9+Math.floor(Math.random()*4);

function btn(x,y,w,h,s,on){g.fillStyle=on?'#f8e8c7':'#d6294c';g.strokeStyle=on?'#d6294c':'#f8e8c7';g.lineWidth=3;rr(x,y,w,h,10);g.fill();g.stroke();g.fillStyle=on?'#421322':'#f8e8c7';const fs=fitSize(s,w-26,17,10);txt(s,x+w/2,y+h/2+fs*.36,fs,on?'#421322':'#f8e8c7')}
function kn(c){return({ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Space:'Espaço',ShiftLeft:'Shift E',ShiftRight:'Shift D',Slash:'/',Period:'.',Mouse0:'Mouse 1',Mouse1:'Mouse 3',Mouse2:'Mouse 2',Comma:',',Semicolon:';'})[c]||c.replace(/^Key|^Digit/,'')}
function drawMenu(){
 if(state==='lobby'){drawLobby();return}
 if(state==='matchcfg'){drawMatchCfg();return}
 if(state==='keys'){txt('CONFIGURAR TECLAS',W/2,52,36,'#f8e8c7');txt('JOGADOR 1',KX[0]+82,90,16,'#4fc3f7');txt('JOGADOR 2',KX[1]+82,90,16,'#ff7043');txt('CONTROLE',KX[2]+82,90,16,'#9ad06b');
  txt('Entrada',30,125,18,'#fff','left');for(let c=0;c<2;c++)btn(KX[c],100,165,38,devName(dev[c?'p2':'p1']),sel===20+c);
  txt(gpOk&&GP.length?'Detectado':'Não detectado',KX[2]+82,125,15,gpOk&&GP.length?'#9ad06b':'#ffd54a');
  const miss=!gpOk?'Controles bloqueados neste ambiente':['p1','p2'].some(q=>dev[q]==='gp'&&!gpFor(q))?'Controle não detectado: aperte um botão nele':'';if(miss)txt(miss,W/2,496,14,'#ffd54a');
  NA.forEach((n,r)=>{txt(n,30,150+r*46+25,18,'#fff','left');for(let c=0;c<3;c++){const i=r*3+c;g.globalAlpha=c<2&&dev[c?'p2':'p1']==='gp'?.4:1;btn(KX[c],150+r*46,165,38,listen===i?'Pressione...':c<2?kn(binds[c?'p2':'p1'][AK[r]]):gpName(gpb[AK[r]]),sel===i);g.globalAlpha=1}});
  btn(300,440,170,40,'Restaurar padrão',sel===18);btn(490,440,170,40,'Voltar',sel===19);
  txt('Clique numa célula e aperte a nova tecla, botão do mouse ou do controle. Esc cancela.',W/2,512,15,'#cfd8ff');return}
 if(state==='menu'){txt('ARENA SUSPENSA',W/2,100,52,'#f8e8c7');txt('Quem cair da plataforma perde uma vida.',W/2,140,18,'#cfd8ff')}
 else if(state==='online'||state==='join'){txt(state==='online'?'ONLINE':'ENTRAR EM SALA',W/2,110,48,'#f8e8c7');if(state==='join')txt(joinErr||'Digite o código de 5 caracteres',W/2,150,18,joinErr?'#ff5252':'#cfd8ff')}
 else if(state==='pause')txt('PAUSADO',W/2,110,52,'#f8e8c7');
 else txt(winner,W/2,110,52,'#f8e8c7');
 items().forEach((it,i)=>btn(W/2-230,190+i*56,460,46,it[0],sel===i));
 if(state==='menu'||state==='pause'){const ok=gpOk&&GP.length;txt(!gpOk?'Controle bloqueado neste ambiente: abra o arquivo direto no navegador':ok?'Controle detectado':'Nenhum controle detectado: aperte um botão nele',W/2,476,13,ok?'#9ad06b':'#ffd54a')}
 txt('Esc: pausar  ·  ↑ ↓ e Enter ou clique para escolher',W/2,512,15,'#cfd8ff');
 txt('Controle: direcional  ·  '+gpName(gpb.jump)+' pular  ·  '+gpName(gpb.atk)+' atacar  ·  '+gpName(gpb.dash)+' dash  ·  Start pausa',W/2,490,12,'#cfd8ff')}
let OFF=0;
let last=0,acc=0;function loop(t){requestAnimationFrame(loop);acc+=Math.min(t-last,100);last=t;
 while(acc>=16.667){acc-=16.667;gpPoll();if(state==='play'){if(GP.some(g=>g.start))pause();else tick()}else{gpMenu();frame++;for(const k in prs)prs[k]=0}}draw()}
genMap();requestAnimationFrame(loop);
